# ══════════════════════════════════════════════════════
# CI — Continuous Integration
# Chạy mỗi khi bạn push code hoặc mở Pull Request
# Mục tiêu: đảm bảo code không bị lỗi trước khi merge
# ══════════════════════════════════════════════════════

name: CI — Kiểm tra code

# ── Khi nào trigger? ──────────────────────────────────
on:
  push:
    branches: [main, develop]   # push lên main hoặc develop
  pull_request:
    branches: [main]             # hoặc ai đó mở PR vào main

# ── Các job sẽ chạy ───────────────────────────────────
jobs:

  test:
    name: Chạy Tests
    runs-on: ubuntu-latest       # GitHub cấp máy Ubuntu miễn phí

    steps:
      # Bước 1: Lấy code từ repo về máy của GitHub
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài Node.js
      - name: ⚙️ Cài Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"           # cache để lần sau cài nhanh hơn

      # Bước 3: Cài dependencies
      - name: 📦 Cài dependencies
        run: npm install

      # Bước 4: Chạy tests — nếu có test fail, pipeline dừng ở đây
      - name: 🧪 Chạy tests
        run: npm test

      # Bước 5: Upload báo cáo coverage (tùy chọn — để xem test bao phủ bao nhiêu %)
      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()             # upload kể cả khi test fail
        with:
          name: coverage-report
          path: coverage/
